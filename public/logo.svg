<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none" role="img" aria-label="Pet Carrier">
  <title>Pet Carrier</title>
  <g transform="translate(4,6)">
    <!-- bag handle -->
    <path d="M12 18 C12 2 36 2 36 18" stroke="#2563EB" stroke-width="3.4" stroke-linecap="round" />
    <!-- bag body -->
    <rect x="2" y="16" width="44" height="30" rx="8" stroke="#2563EB" stroke-width="3.4" fill="white" />
    <!-- mesh window -->
    <rect x="10" y="22" width="28" height="20" rx="4" stroke="#2563EB" stroke-width="2" fill="#EFF6FF" />
    <!-- mesh grid dots -->
    <circle cx="14" cy="26" r="1.4" fill="#2563EB" />
    <circle cx="34" cy="26" r="1.4" fill="#2563EB" />
    <circle cx="14" cy="38" r="1.4" fill="#2563EB" />
    <circle cx="34" cy="38" r="1.4" fill="#2563EB" />
    <!-- dog ears -->
    <polygon points="17,29 19,22 23,28" fill="#2563EB" />
    <polygon points="31,29 29,22 25,28" fill="#2563EB" />
    <!-- dog head peeking through window -->
    <circle cx="24" cy="33" r="6" fill="#2563EB" />
  </g>
  <text x="64" y="39" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-0.5" fill="#111827">Pet Carrier</text>
</svg>
