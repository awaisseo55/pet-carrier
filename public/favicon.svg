<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pet Carrier">
  <title>Pet Carrier</title>
  <rect width="512" height="512" rx="96" fill="#2563EB" />
  <g transform="translate(56,56)">
    <!-- bag handle -->
    <path d="M100 150 C100 17 299 17 299 150" stroke="white" stroke-width="28" stroke-linecap="round" fill="none" />
    <!-- bag body -->
    <rect x="17" y="133" width="365" height="249" rx="66" stroke="white" stroke-width="28" fill="none" />
    <!-- mesh window -->
    <rect x="83" y="183" width="232" height="166" rx="33" stroke="white" stroke-width="17" fill="none" />
    <!-- mesh grid dots -->
    <circle cx="116" cy="216" r="12" fill="white" />
    <circle cx="282" cy="216" r="12" fill="white" />
    <circle cx="116" cy="315" r="12" fill="white" />
    <circle cx="282" cy="315" r="12" fill="white" />
    <!-- dog ears -->
    <polygon points="141,241 158,183 191,232" fill="white" />
    <polygon points="257,241 241,183 208,232" fill="white" />
    <!-- dog head peeking through window -->
    <circle cx="199" cy="274" r="50" fill="white" />
  </g>
</svg>
